# Hand-curated mapping for every JLCPCB Basic part that is NOT a plain chip
# resistor or MLCC (those are generated by rule in tools/generate_libs.py).
#
# One table per LCSC number:
#   lib        "resistors" | "capacitors" | "other"
#   name       symbol name in the library; must contain the package (e.g. SOT-23)
#   value      Value field
#   symbol     KiCad stock symbol "<Lib>:<Name>" the part is copied from
#              (derived symbols are flattened), or "box" for a generated box symbol
#   footprint  KiCad stock footprint "<Lib>:<Name>" copied into the library's .pretty;
#              defaults to the stock symbol's own Footprint field
#   pins       optional pin-number remap {old = new} applied to the copied symbol,
#              for parts whose pinout differs from the stock symbol
#   box        for symbol = "box": {ref, left, right, top, bottom}, each side a list of
#              [number, name, electrical_type]
#   verified   how the pinout was checked (free text, for humans and LLMs)
#
# Pin numbers must match the footprint's pad numbers; the generator refuses to
# write a part whose symbol pins and footprint pads disagree.

